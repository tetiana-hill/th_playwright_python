[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["."]
base_url = "https://www.saucedemo.com"
addopts = "-ra --strict-markers --strict-config --tracing=retain-on-failure --screenshot=only-on-failure --full-page-screenshot"
markers = [
    "smoke: critical login and purchase paths",
    "negative: rejected input or access",
    "e2e: complete customer journey",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
